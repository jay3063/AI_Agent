name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-test:
    name: quality-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install quality/test tools
        run: pip install lizard radon pylint coverage

      - name: Detect tracked Python sources
        id: detect
        shell: bash
        run: |
          if git ls-files '*.py' | grep -q .; then
            echo "has_python=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_python=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No Python sources yet
        if: steps.detect.outputs.has_python == 'false'
        run: echo "::notice::No .py files are tracked yet. Unit-test/quality gates (CLAUDE.md) will activate automatically once source code is added."

      - name: Unit tests with branch coverage (must be 100%)
        if: steps.detect.outputs.has_python == 'true'
        shell: bash
        run: |
          coverage run --branch -m unittest discover -v
          coverage report -m --fail-under=100

      - name: Function size / cyclomatic complexity (lizard)
        if: steps.detect.outputs.has_python == 'true'
        shell: bash
        run: lizard -l python -L 50 -C 10 .

      - name: Duplicate code / naming convention (pylint)
        if: steps.detect.outputs.has_python == 'true'
        shell: bash
        run: |
          FILES=$(git ls-files '*.py')
          pylint --enable=duplicate-code,invalid-name --min-similarity-lines=8 $FILES

      - name: Doxygen comment ratio (must be >= 20%)
        if: steps.detect.outputs.has_python == 'true'
        shell: bash
        run: |
          python - <<'PYEOF'
          import json
          import subprocess
          import sys

          files = subprocess.run(
              ["git", "ls-files", "*.py"], capture_output=True, text=True, check=True
          ).stdout.split()

          failed = []
          for path in files:
              raw = subprocess.run(
                  ["radon", "raw", "-s", "--json", path],
                  capture_output=True, text=True, check=True,
              ).stdout
              metrics = json.loads(raw)[path]
              loc = metrics["loc"] or 1
              ratio = (metrics["comments"] + metrics["multi"]) / loc
              if ratio < 0.20:
                  failed.append((path, round(ratio * 100, 1)))

          if failed:
              for path, pct in failed:
                  print(f"::error file={path}::Doxygen comment ratio {pct}% is below the required 20%")
              sys.exit(1)

          print("All tracked Python files satisfy the 20% Doxygen comment-ratio gate.")
          PYEOF
